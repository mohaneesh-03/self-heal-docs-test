name: Self-Healing Documentation

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    # Only run when the PR was actually merged, not just closed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can create branches and read file contents
          fetch-depth: 0

      - name: Run Self-Healing Docs Action
        uses: mohaneesh-03/self-heal-docs@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          groq_api_key: ${{ secrets.GROQ_API_KEY }}
          pr_number: ${{ github.event.pull_request.number }}
